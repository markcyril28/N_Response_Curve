# Operator controls first; source, schema, and path registries follow. Comment
# or uncomment list members to disable/enable them; dependency-bound lists say
# when all members must move together.
# --- Pipeline execution ---
[run]
# Phases 2-5 form one dependency chain; keep all four for a normal run. Comment
# all four to reuse a verified completed release instead. Partial lists are
# rejected.
phases = [
  "phase_2",  # ingest, curate, resolve series, clean, eligibility, QC (no writes)
  "phase_3",  # observed curves + policy-authorized model attempts
  "phase_4",  # dataset views, factor catalog, analysis candidates, R dispatch
  "phase_5",  # stage, validate, checksum, promote release package
]

# Mode choices:
#   "validate" checks config/sources/ingest/eligibility/QC; no modeling, no writes.
#   "test"     full pipeline on <= test_group_limit series -> test_output_root.
#   "full"     all resolved series -> reports_root; every source needs a
#              verified adapter. No [source_data_policy] manifest required;
#              missing source evidence is held/ledgered, never inferred.
mode = "full"
# Allow atomic replacement of the stable release target (kept under
# .release_history). Never bypasses package gates.
overwrite = true
# Empty phases list: reuse only if config/code/policy/source bytes still
# checksum-match. With phases 2-5 listed, they always execute. Default: false.
reuse_completed_release = true
random_seed = 20260720
test_group_limit = 12
fail_fast = true
# validate fails on any review-bearing row; test/full process eligible data
# and ledger the findings instead.
qc_gate = "fail_on_any_review"
# max_parallel_r_jobs * r_threads_per_job <= affinity CPU count. 12-job
# dispatch, 1 thread/job: reproducible independent fits over multithreaded
# reductions within one fit.
r_threads_per_job = 1
max_parallel_r_jobs = 12
r_stage_timeout_seconds = 1800
r_termination_grace_seconds = 15
cpu_detection = "affinity"
