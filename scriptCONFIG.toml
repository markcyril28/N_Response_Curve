# Frequently adjusted operator controls
# Toggle a list member by commenting/uncommenting its individual line. Keep
# routine run, selection, and analysis controls above the reference registries.
[run]
# Mode choices:
#   "validate" checks configuration, sources, ingestion, canonicalization,
#              response-series resolution, eligibility, and QC; it does not
#              run modeling or write pipeline outputs.
#   "test"     runs the complete pipeline on at most test_group_limit resolved
#              series and writes under paths.test_output_root.
#   "full"     runs all resolved series and writes under paths.reports_root;
#              every enabled source must be verified with an assigned adapter.
mode = "test"
overwrite = true
random_seed = 20260720
test_group_limit = 12
fail_fast = true
qc_gate = "fail_on_any_review" # OPS-03 Option B: validate/full fail after complete warning/unresolved/exclusion review.
r_threads_per_job = 1
max_parallel_r_jobs = 1
r_stage_timeout_seconds = 1800
r_termination_grace_seconds = 15
cpu_detection = "affinity"
[selection]
# Comment one member to disable it; uncomment it to restore it. The parsed list is authoritative.
scope_countries = ["PH"]
series_identity_dimensions = [
  "water_regime",
  "season",
  "region",
  "province",
  "variety",
  "planting_year",
]

enabled_sources = [
  "core_trial_data",
  # "ph_combined_nopt_rcm", # Received and registered; disabled until its adapter, mapping, precision, and restricted-data gates pass.
  # "ltcce",
]

enabled_models = [
  "linear",
  "quadratic",
  "linear_plateau",
  "quadratic_plateau",
  "mitscherlich",
]

comparison_dimensions = [
  "water_regime",
  "season",
  "region",
  # "province",
  # "variety",
  # "recommendation_class",
]

output_formats = [
  "csv",
  "parquet",
  # "xlsx",
]

figure_formats = [
  "png",
  "jpeg",
]

fill_down_fields = [
  "Study_ID",
  "Trial ID",
  "Source",
  "Author(s)",
  "Year of Publication",
]

treatment_classes = [
  "zero_n",
  "absolute_control",
  "RCM",
  "FP",
  "NOPT_NPK",
  "other",
  "unresolved",
]

# Eligibility and curve-fitting controls
[eligibility]
minimum_distinct_n_levels = 3
minimum_complete_n_yield = 3
minimum_model_residual_df = 1
require_zero_n_for_primary = false
primary_inorganic_only = true
organic_policy = "retain_flagged"
p_k_policy = "retain_flagged"
zero_n_policy = "allow_flagged"
constant_nutrient_tolerance = 1e-8
n_level_tolerance_kg_ha = 1e-6
n_rate_min_kg_ha = 0.0
n_rate_max_kg_ha = 400.0
yield_min_t_ha = 0.0
yield_max_t_ha = 30.0
high_n_review_threshold_kg_ha = 200.0

# Named critical codes remain useful severity metadata. Independently, the
# implemented OPS-03 Option B gate makes every warning, unresolved state, or
# exclusion found by complete Phase 2 review block validate/full promotion.
critical_error_codes = [
  "YIELD_UNIT_CONFLICT",
]

# Model fitting controls
[modeling]
no_extrapolation = true
minimum_residual_df = 1
convergence_tolerance = 1e-8
plausible_yield_min_t_ha = 0.0
plausible_yield_max_t_ha = 30.0
plot_grid_points = 101
model_selection_metric = "all_credible_no_selection" # MOD-02 Option D.
tie_breaking = "not_applicable"

candidate_models = [
  "linear",
  "quadratic",
  "linear_plateau",
  "quadratic_plateau",
  "mitscherlich",
]

parameter_bounds = { n_rate_min_kg_ha = 0.0, n_rate_max_kg_ha = 400.0 }
allow_uncertainty = false
uncertainty_method = "deferred_until_evidence_gate"
allow_baseline_response_metrics = false # ELG-10 C stays inactive until reviewed class and model-policy artifacts are configured.

# Output and logging controls
[outputs]
atomic_writes = true
allow_source_targets = false
row_level_qc = true
collision_policy = "replace_only_with_overwrite"

[logging]
level = "INFO"
write_logs_in_validate = false

# Runtime and engine controls
[engines]
python_command = "python"
rscript_command = "Rscript"
r_entrypoint = "modules/n_response_curve/pipeline/run_explanatory.R"
require_conda_environment = true
require_linux_rscript = true
allow_runtime_r_package_install = false
allow_automatic_engine_fallback = false
r_use_vanilla_session = true

[engines.assignments]
data_pipeline = "python"
per_series_curve_fitting = "python"
coverage_and_missingness = "python"
one_factor_descriptive = "python"
one_factor_inferential = "r"
all_supported_interactions = "r"
multivariable_mixed_effects = "r"
observation_level_curve_modification = "r"
penalized_predictive_models = "python"
curve_feature_clustering = "python"
dataset_and_source_robustness = "python"
final_reporting = "python"
marginal_contrasts = "r"

