# Eligibility and curve-fitting controls
# --- Eligibility controls ---
[eligibility]
minimum_distinct_n_levels = 3
minimum_complete_n_yield = 3
minimum_model_residual_df = 1
require_zero_n_for_primary = false
primary_inorganic_only = true
organic_policy = "retain_flagged"
p_k_policy = "retain_flagged"
zero_n_policy = "allow_flagged"
constant_nutrient_tolerance = 1e-8
n_level_tolerance_kg_ha = 1e-6
n_rate_min_kg_ha = 0.0
n_rate_max_kg_ha = 400.0
yield_min_t_ha = 0.0
yield_max_t_ha = 30.0
high_n_review_threshold_kg_ha = 200.0

# Severity metadata only; qc_gate=fail_on_any_review independently fails
# validation on any Phase 2 warning/unresolved/exclusion.
critical_error_codes = [
  "YIELD_UNIT_CONFLICT",
]

# Model fitting controls
# --- Modeling controls ---
[modeling]
no_extrapolation = true
minimum_residual_df = 1
convergence_tolerance = 1e-8
plausible_yield_min_t_ha = 0.0
plausible_yield_max_t_ha = 30.0
plot_grid_points = 101
model_selection_metric = "all_credible_no_selection" # MOD-02 Option D.
tie_breaking = "not_applicable"

candidate_models = [
  "linear",
  "quadratic",
  "linear_plateau",
  "quadratic_plateau",
  "mitscherlich",
]

parameter_bounds = { n_rate_min_kg_ha = 0.0, n_rate_max_kg_ha = 400.0 }
allow_uncertainty = false
uncertainty_method = "deferred_until_evidence_gate"
# ELG-10 C: inactive until reviewed treatment-class/model-policy evidence exists.
allow_baseline_response_metrics = false

# Output and logging controls
# --- Output settings ---
[outputs]
atomic_writes = true
allow_source_targets = false
row_level_qc = true
collision_policy = "replace_only_with_overwrite"
# Wipes the mode's whole release root (test_output_root/reports_root): every
# package, .release_history entry, staging dir. Normal replacement is already
# atomic without this. Requires [run].overwrite=true, conflicts with release
# reuse, forbidden in validate mode, never enable during a concurrent run.
clear_output_root_before_run = false

# --- Logging settings ---
[logging]
level = "INFO"
# Must stay false in validate mode. Launcher logs under N_RESPONSE_LOG_ROOT are
# written every mode regardless, unaffected by this key.
write_logs_in_validate = false
# Clears log_files/jsonl_logs/error_warn_logs before logging starts. Must
# stay false in validate mode.
clear_log_root_before_run = false

# Runtime and engine controls
# --- Engine controls ---
[engines]
