# ANA-05 A decided, but the versioned [analysis_matrix.support_policy] table
# is absent, so inferential/predictive/higher-order families stay disabled.

# Configured descriptive overlay figures generated inside Phase 5 release
# staging (no-op in validate). Declared by the v3 manifest and covered by the
# main release ledger, with nested manifests/checksums for focused verification.
# --- Overlay outputs ---
[custom_overlays]
enabled = true
# One transactional release promotion owns this diagnostic set. Unknown extras,
# malformed ledgers, tampered inputs, and post-release mutation fail closed.
replace_existing = true
# Adds the two zero-N yield-stratum figures plus signed diagnostic metadata.
generate_zero_n_strata = true
# Governed v3 overlay membership plus the release-safe ledger are the inputs.
source_name = "core_trial_data"
# Diagnostic thresholds only; do not affect governed model eligibility.
zero_n_yield_threshold_t_ha = 5.0
yield_threshold_t_ha = 7.8
high_n_threshold_kg_ha = 200.0
# Stable full-mode package path; must equal the active release target. The
# random seed remains in the run identity, not in the output-folder name.
package_path = "WF/06_Reports/n_response_full"

# Source-wide and strict-yield-selection overlays: a separately signed extension
# inside the full report container, outside its governed manifest and checksum
# inventory. Outputs are organized under figures/overlay/<source_name>/, and the
# whole container remains restricted/not for release.
# --- Source dataset overlays ---
[source_dataset_overlays]
# Disabled by the selected SRC-09 Option C storage boundary. Re-enable only after
# a replacement A/B storage policy and its filesystem controls are approved.
enabled = false
# Replace only this generator's separately signed diagnostic bundle.
replace_existing = true
# Explicitly permits only the isolated diagnostic extension subtree below.
placement = "restricted_package_extension"
# Source membership is retained as configuration memory while materialization is disabled.
source_names = ["core_trial_data", "ltcce", "ph_combined_nopt_rcm"]
# Strict observed-yield selection; qualifying whole trajectories/linked rows
# retain all their finite observations. This is descriptive, not a fitted gate.
yield_threshold_t_ha = 7.8
# Host package bytes remain unchanged and are bound by the extension manifest.
package_path = "WF/06_Reports/n_response_full"
output_root = "WF/06_Reports/n_response_full/restricted_diagnostics/source_dataset_overlays"

