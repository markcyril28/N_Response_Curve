# Goal: produce a comprehensive descriptive statistical profile of every
# registered source dataset in this project — the internal literature extraction
# (core_trial_data) and the two restricted trial datasets (ph_combined_nopt_rcm,
# ltcce) — so that the shape, completeness, measurement scale, and agronomic
# coverage of each dataset are documented before any inferential claim is made
# about them.
#
# The profile answers four questions per dataset, and one across datasets:
#   1. Structure   — how many physical columns and logical data rows exist, which
#                    headers are blank or duplicated, which columns are wholly
#                    empty, and how completeness is distributed across rows.
#   2. Numeric     — for every numeric-parsable column: count, missing, mean, sd,
#                    coefficient of variation, min/quartiles/max, IQR, median
#                    absolute deviation, skewness, kurtosis, zero and negative
#                    counts, and Tukey outlier counts at 1.5 and 3.0 IQR.
#   3. Categorical — for every categorical column: cardinality, mode, Shannon
#                    entropy (raw and normalized), singleton-level count, and a
#                    frequency table of levels at or above a reporting threshold.
#   4. Agronomic   — the domain view: inorganic N-rate distribution and ladder
#                    geometry, grain-yield distribution on a common t/ha basis
#                    with its unit lineage recorded, yield binned against N rate,
#                    temporal coverage, zero-N check observations, and the
#                    composition of every context field each dataset binds —
#                    the recorded ones as recorded, plus applied N and year
#                    banded into ordinal levels the recipe derives.
#   5. Cross-cut   — the three datasets side by side on a harmonized N-yield
#                    observation basis, with an explicit comparability audit of
#                    what is and is not commensurable between them.
#
# This is descriptive only. It reports what the recorded data contain. It fits no
# response model, selects no optimum, makes no fertilizer recommendation, and
# asserts no causal or between-dataset equivalence claim. Differences reported
# between datasets are differences in what was recorded, not measured effects.
#
# Architecture: a standalone, hash-bound companion recipe, sibling to
# grain_yield_responseCONFIG.toml. scriptCONFIG.toml remains the repository
# configuration authority and supplies the registered source contract (paths,
# encodings, adapters, classifications); this recipe reads sources only through
# the position-safe ingest path in modules/n_response_curve/data/ingest.py, so
# the 302-column core extract with its duplicate and blank headers is profiled by
# physical position and never by header name. Output is written outside the
# immutable N-response release package and is never appended to that package.
#
# Data governance: ph_combined_nopt_rcm and ltcce are data_classification =
# "restricted". Every artifact derived from them is labeled with its source
# classification in run_manifest.json, and the personal- and location-identifier
# columns named in [privacy].suppressed_headers are excluded from every emitted
# table — no level frequency, example value, or row-level export may carry them.

# --- Execution settings ---
[run]
mode = "full" # validate | test | full
# Replace an existing bundle, but only after it verifies against its own
# checksums. A bundle that was altered after it was written aborts the run
# instead of being overwritten, so the alteration is never lost silently.
overwrite = true
# Recorded in run_manifest.json for reproducibility. The profile itself is fully
# deterministic — example values are taken in order of first appearance and no
# resampling is performed — so the seed changes no output today; it exists so a
# later resampling statistic cannot be added without a declared seed.
random_seed = 20260816
fail_fast = true
# Row-level export of the harmonized cross-source N-yield frame. Restricted rows
# are included when true; the table is classification-labeled in the manifest.
include_row_level_observations = true

# --- Input sources ---
[sources]
# Profiled datasets. Each name must be an enabled source in the base config; the
# path, encoding, adapter, and data classification are read from there rather
# than restated here, so this recipe cannot drift from the registered contract.
profiled = ["core_trial_data", "ph_combined_nopt_rcm", "ltcce"]

# --- Privacy suppression ---
[privacy]
# Matched on exact header text. Their cells are blanked before any profile sees
# them, so no value from these columns reaches any emitted table: they carry no
# level frequency, no example value, and no row-level export.
# farmer_first_name / farmer_last_name are personal identifiers; boundary1
# through boundary4 resolve to a named barangay-level location in the restricted
# NOPT dataset.
# What IS retained is the schema fact that the column exists: the structural
# inventory keeps one row per physical column — reporting the suppressed column
# as 0 nonblank of N, with its suppression reason — so the column arithmetic
# stays reconcilable against the 302/228/12 source shapes. The header name is
# metadata about the file's layout; the suppressed values are the personal data.
# latitude / longitude are suppressed for the same reason as boundary1..4 and
# more urgently. In ph_combined_nopt_rcm they are recorded to seven and eight
# decimal places on every one of the 718 rows across 99 distinct sites — finer
# than the barangay names already suppressed here — so together with the
# recorded year, variety, and yield they resolve to an individual cooperating
# farmer's field. Suppressing the boundary names while publishing the exact
# coordinate of the same row would have protected nothing.
#
# This matters most for the numeric profile rather than the example values: an
# unsuppressed coordinate column reaches numeric_summary as a full quantile
# ladder (min, p01, p05, q1, median, q3, p95, p99, max), which is the bounding
# box and interior density of the whole restricted trial network, not three
# sample cells.
#
# core_trial_data's coordinate and place-name columns are deliberately NOT
# listed. That source is data_classification = "internal" and is extracted from
# published literature, so its trial locations are already public and describing
# them discloses nothing that the cited papers do not. This list targets the
# restricted farmer-level source.
suppressed_headers = [
    "farmer_first_name",
    "farmer_last_name",
    "boundary1",
    "boundary2",
    "boundary3",
    "boundary4",
    "latitude",
    "longitude",
]

# --- Structure profiling rules ---
[structure]
# A column is treated as numeric when at least this share of its nonblank cells
# parse as finite numbers; otherwise it is profiled as categorical.
numeric_parse_threshold = 0.80
# Columns with more distinct nonblank values than this are profiled as
# high-cardinality identifiers: summarized, but not level-tabulated.
maximum_categorical_cardinality = 60
example_values_per_column = 3

# --- Numeric profiling rules ---
[numeric]
outlier_iqr_multipliers = [1.5, 3.0]
quantiles = [0.01, 0.05, 0.25, 0.50, 0.75, 0.95, 0.99]
histogram_bins = 24
minimum_observations = 3

# --- Categorical profiling rules ---
[categorical]
# A level is written to the frequency table only at or above this count, so rare
# levels of restricted context fields cannot become de facto row identifiers.
minimum_level_count = 3
maximum_levels_reported = 40

# --- Agronomic profiling rules ---
[agronomic]
# Tuning shared by every dataset's agronomic profile.
nitrogen_bin_width_kg_ha = 30.0
# Width of the applied-N bands the context composition reports: 0 on its own as
# the zero-N check arm, then 0-50, 50-100, and so on. Distinct from the bin
# width above, which sets the resolution of the yield-against-N table and is not
# a reading of the ladder. Both are free to differ; neither derives the other.
applied_n_band_width_kg_ha = 50.0
# Span of the year bands the context composition reports. Unrelated to the
# temporal_coverage table, which stays at one row per calendar year and is the
# record of coverage; this is era read as a context field. Five rather than a
# decade because the shortest-running dataset spans six years, and a decade
# would collapse it to a single bar stating nothing but its own scope.
year_band_span_years = 5
zero_n_tolerance_kg_ha = 0.00000001
n_level_tolerance_kg_ha = 0.01
minimum_group_observations = 3

# The [agronomic.<source>] tables below bind this recipe's quantities to physical
# columns of each registered source. Positions are 1-based, and each is verified
# against the header text recorded beside it when the source is read, so a shape
# change in any source fails the recipe rather than silently reprofiling the
# wrong column. Binding by position rather than by header name is required, not
# stylistic: the core extract carries seven duplicated and sixteen blank header
# names, so header text does not identify a column there.

# --- Source bindings: core_trial_data ---
[agronomic.core_trial_data]
nitrogen_rate = { position = 131, header = "Inorganic N_rate (kg N ha-1)" }
yield_t_ha = { position = 283, header = "Grain Yield (t ha-1)" }
yield_kg_ha = { position = 282, header = "Grain Yield (kg ha-1)" }
year = { position = 31, header = "Year of Planting" }
context = [
    { position = 29, header = "Ecosystem (Irrigated/Rainfed/Upland)", label = "water_regime" },
    { position = 30, header = "Season (Dry/Wet)", label = "season" },
    { position = 16, header = "Region", label = "region" },
    { position = 27, header = "Rice Variety", label = "variety" },
    # What kind of trial each record came from. Reported as recorded, including
    # the RCM, NOPT and LTCCE levels — those name the same programmes as the two
    # other registered sources, so the overlap between the three datasets is a
    # finding this bar makes visible rather than something to harmonize away.
    { position = 6, header = "Type of Experiment/ Study/Trial", label = "experiment_type" },
    # The coarse geography, beside the 13-level Region above. 'Luz' and 'LUZ'
    # are the same island recorded two ways and are drawn as two levels: this
    # recipe reports levels as recorded and does not case-fold, so the bar shows
    # the entry inconsistency instead of concealing it.
    { position = 15, header = "Island (Luz/Vis/Min)", label = "island" },
    # Likewise 'Split plot' and 'Split-plot', and 'not stated' is a recorded
    # level rather than a blank cell — a trial that stated no design is not the
    # same as a trial whose design column was never filled.
    { position = 21, header = "Experimental_Design", label = "experimental_design" },
    # Number of split applications of the N dose. A management condition of the
    # response, not a study attribute, and recorded on 45% of rows: the bar
    # shows the shortfall rather than renormalizing onto the filled subset.
    #
    # Its '0' level is not independent of the applied-N bar and does not mean
    # one application: of the 121 harmonized rows recording 0 splits, 112 are
    # the zero-N arm, where no split is the arithmetic consequence of no dose.
    # The other 9 record 0 splits against rates up to 150 kg N ha-1, and 17
    # zero-N rows record 2 or 3 splits, so the column and the rate disagree in
    # both directions on 26 rows. Reported as recorded either way; the
    # disagreement is a finding about the extract, not something to reconcile
    # inside a descriptive profile.
    { position = 94, header = "N Split ", label = "n_split" },
    # Whether an organic source was applied alongside the inorganic N the
    # profile bins on. Bears directly on what the recorded rate means.
    { position = 171, header = "Organic Fertilizer (Y/N)", label = "organic_fertilizer" },
]
grouping = [
    { position = 1, header = "Study_ID", label = "study" },
    { position = 7, header = "Trial ID", label = "trial" },
]
# Columns whose combination identifies one N ladder — rows that differ only in
# N rate. Used for ladder geometry only; it is a descriptive grouping, not the
# governed response-series resolution performed by the main pipeline.
#
# Trial ID alone, deliberately. Study_ID is populated on only 70 of the 1490
# data rows because the extraction template merges it down each study block, and
# this recipe does not forward-fill — the governed curation path likewise leaves
# study_uid unresolved on a blank Study_ID rather than inferring it. Trial ID is
# populated on every row and is globally unique: all 206 distinct Trial IDs map
# to exactly 206 distinct (Study_ID, Trial ID) pairs under a forward-filled
# study, so no trial identifier is reused across studies and keying on it alone
# collapses nothing. The Study_ID sparsity is reported as a structural finding.
series = [
    { position = 7, header = "Trial ID", label = "trial" },
]

# --- Source bindings: ph_combined_nopt_rcm ---
[agronomic.ph_combined_nopt_rcm]
# The registered schema evidence for this source (sheet_2_notes.csv) names four
# N treatments per record, each in its own column pair:
#   FP-N     fp_actual_n_kg_per_ha (58)  / fp_measured_grainyield_dry (103)
#   RCM-N    rcm_actual_n_kg_per_ha (85) / rcm_measured_grainyield_dry (104)
#   NOPT-N   nrate (140)                 / full_fert_yield (148)
#   NOPT-0N  0                           / n0_yield (149)
# `nitrogen_rate` binds the NOPT-N arm because that is the designed rate the
# rest of the recipe profiles. The FP-N arm is bound below so the recorded-rate
# figures can show it; it is the farmer-chosen rate, spans 5-515 kg N ha-1, and
# is the reason this source's recorded rates are not the 70-150 band alone.
# RCM-N is deliberately left unbound: it restates the recommended rate the NOPT
# arm already represents, and a fourth translucent series would be unreadable.
nitrogen_rate = { position = 140, header = "nrate" }
yield_t_ha = { position = 148, header = "full_fert_yield" }
zero_n_yield_t_ha = { position = 149, header = "n0_yield" }
farmers_practice_n_rate = { position = 58, header = "fp_actual_n_kg_per_ha" }
farmers_practice_yield_t_ha = { position = 103, header = "fp_measured_grainyield_dry" }
year = { position = 11, header = "year" }
context = [
    { position = 13, header = "water_regime", label = "water_regime" },
    { position = 15, header = "cropping_season", label = "season" },
    { position = 126, header = "season", label = "season_coded" },
    { position = 133, header = "variety", label = "variety" },
    # Whether the water supply was adequate, short, or in submergence. A
    # condition of the season, distinct from the irrigated/rainfed regime above.
    { position = 14, header = "water_supply", label = "water_supply" },
    { position = 16, header = "cropping_intensity", label = "cropping_intensity" },
    # Bears on the soil N the crop started with, and so on what the applied rate
    # had to supply.
    { position = 17, header = "previous_crop", label = "previous_crop" },
    # The as-recorded establishment column, at position 18, and deliberately not
    # the fully populated `crop_establishment_method` at position 135 or the
    # `crop_establishment_imputed` at 19. Position 135 disagrees with the
    # recorded column on nine rows and is filled where the recorded one is
    # blank, so it carries an inference; this recipe reports what was recorded
    # and lets the nine unrecorded rows fall in the residual.
    { position = 18, header = "crop_establishment", label = "establishment" },
    { position = 27, header = "variety_type", label = "variety_type" },
    # Recorded as day ranges by the source, not banded here.
    { position = 28, header = "growth_duration", label = "growth_duration" },
    { position = 30, header = "soil_fertility", label = "soil_fertility" },
    # Straw removed or returned: the residue N the next crop inherits.
    { position = 137, header = "straw_retention", label = "straw_retention" },
]
# Left unbound on purpose, so that a later reader does not take the omission for
# an oversight:
#   - agro_ecology / agro_ecology_short (21-22), soil_class (29), climate_zone
#     and climate_zone_beck_et_al_2023 (122-123), gaez_4_0_aez5 / aez8 (120-121)
#     are joined to the trial from published global rasters at its coordinates,
#     not recorded by the trial. The composition figures state that levels are
#     reported as recorded, and drawing a raster lookup beside a recorded
#     condition would make that statement false. The tell is in the values:
#     'Dominantly built-up land' and 'Dominantly very steep terrain' are
#     recorded against rice trials, which is the resolution of the raster
#     showing through, not the site.
#   - production_system (125), semester (12) and season (126, bound above only
#     to be named as a duplicate encoding) restate water_regime and
#     cropping_season in a second vocabulary.
#   - research_season (10) is the administrative campaign label, which the year
#     binding already covers.
grouping = [
    { position = 1, header = "rcm_reference", label = "study" },
    { position = 2, header = "nopt_reference", label = "trial" },
]
# Each linked NOPT/RCM record is its own paired comparison: the full-fertilizer
# arm is the row and the zero-N arm is the paired n0_yield column, so a "series"
# here is a single record and carries exactly one N rate by construction.
series = [
    { position = 1, header = "rcm_reference", label = "study" },
    { position = 2, header = "nopt_reference", label = "trial" },
]

# --- Source bindings: ltcce ---
[agronomic.ltcce]
nitrogen_rate = { position = 10, header = "Nfert" }
yield_t_ha = { position = 12, header = "GYtha" }
year = { position = 4, header = "Year" }
context = [
    { position = 5, header = "Season", label = "season" },
    { position = 3, header = "Site", label = "site" },
    { position = 8, header = "Variety", label = "variety" },
    # The variety treatment slot of the long-term design, not a cultivar: each
    # of V1..V6 spans 1968-2017 and carries 10 to 38 distinct cultivars as newer
    # releases replaced older ones in that slot. It is the low-cardinality
    # companion to the 92-level Variety column above, and the only form of the
    # genotype axis a share bar can label.
    { position = 9, header = "VarCode", label = "variety_code" },
    { position = 7, header = "Establishment", label = "establishment" },
    # Also the `trial` grouping key below. Bound here as well because it is a
    # condition of the observation and not only an identifier: the two levels
    # partition the series in time (Split-split-plot 1968-1991, Split-plot
    # 1991-2017), so a reader who does not see it can mistake an era effect for
    # a treatment effect.
    { position = 1, header = "Design", label = "design" },
    # One recorded level. Kept so that the figure states the scope it covers
    # rather than leaving a bound-but-constant field invisible.
    { position = 6, header = "Crop", label = "crop" },
    # Also the `study` grouping key below. Constant like Crop above ('LTCCE-HP'
    # on every row) and bound here for the same reason: leaving it out would
    # not hide variation, it would just hide the scope statement.
    { position = 2, header = "Expt", label = "expt" },
    # Physical replicate label, 1-4. Not a plot identifier — the physical-column
    # evidence records that Rep does not uniquely key a plot — but it is a
    # recorded condition of the observation and, unlike the fields above, not
    # bound anywhere else in this recipe.
    { position = 11, header = "Rep", label = "rep" },
]
grouping = [
    { position = 2, header = "Expt", label = "study" },
    { position = 1, header = "Design", label = "trial" },
]
# The LTCCE N ladder is nested within year, season, and variety: the registered
# provenance note records exactly four N levels in all 785 year-season-variety
# groups, so those three columns — not the experiment or design label — are what
# identifies one ladder.
series = [
    { position = 4, header = "Year", label = "year" },
    { position = 5, header = "Season", label = "season" },
    { position = 8, header = "Variety", label = "variety" },
]

# --- Output formats ---
[outputs]
table_formats = ["csv"]
figure_formats = ["jpeg"]
figure_dpi = 220
figure_width_inches = 10.0
figure_height_inches = 6.4

# --- Input integrity checks ---
[expected_inputs]
# The three registered intake CSVs are pinned: they are stable provenance copies,
# and a change to any of them invalidates this profile.
#
# Deliberate deviation from grain_yield_responseCONFIG.toml: the base config hash
# is NOT pinned here. scriptCONFIG.toml is edited in the ordinary course of
# operating the repository, and a pinned hash would hard-fail this recipe on an
# unrelated edit. The observed base-config hash is recorded in run_manifest.json
# at run time instead, which preserves the audit trail without the brittleness.
core_trial_data_sha256 = "88e492add192621382d9e198af7558882de4d666b6934ceefc1cd688e076d5de"
ph_combined_nopt_rcm_sha256 = "2f9b05914f50b3935ad52b4d3ee2444a6d9fbd43fcf2f52719ea595e33ac9076"
ltcce_sha256 = "f8ab7c50ca51f95c596d15e5d01ba23749dce085da050db56956efb803330ef8"

# --- Paths ---
[paths]
base_config = "scriptCONFIG.toml"
output_root = "WF/03_Quality_Control/descriptive_statistics"
test_output_root = "WF/06_Reports/descriptive_statistics_test"
